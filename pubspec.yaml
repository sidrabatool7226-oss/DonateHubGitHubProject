name: donatehub_android_studio
description: "DonateHub - Lend a hand, change a life"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^6.2.1
  image_picker: ^1.0.7
  cloudinary_public: ^0.23.1
  url_launcher: ^6.3.1
  http: ^1.2.1
  webview_flutter: ^4.0.0
  get: ^4.6.6
  get_storage: ^2.1.1
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.1
  google_mlkit_text_recognition: ^0.13.0   # ✅ ab andar hai
  path_provider: ^2.1.5                     # ✅ ab andar hai
  image_cropper: ^8.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fl_chart: ^0.68.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21