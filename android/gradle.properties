org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# ?? NEW ? fixes "Daemon compilation failed / Connection to the Kotlin
# daemon has been unexpectedly lost" crashes. The Kotlin compiler runs
# in its OWN separate daemon process (not the same one as Gradle's
# -Xmx8G above), and without this line it had no explicit memory
# setting at all. On a machine where Gradle (8GB) + Android Studio +
# an emulator are all running at once, that daemon can be starved of
# memory or killed by the OS/antivirus, which shows up as exactly the
# "Connection reset" / JVM crash log seen in this error.
kotlin.daemon.jvm.options=-Xmx3g

# If the crash still happens after trying the steps below, uncomment
# this line ? it runs Kotlin compilation inside Gradle's own process
# instead of a separate daemon, which is slower per build but cannot
# hit this specific "lost connection to daemon" crash at all:
# kotlin.compiler.execution.strategy=in-process